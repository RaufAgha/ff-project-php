{% extends 'base.html' %}

{% block title %}Delete Transaction{% endblock %}

{% block content %}

<h2>Are you sure you want to delete?</h2>

<p><strong>{{ object.title }}</strong> - {{ object.amount }}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    <a href="{% url 'transaction_list' %}" type="submit">Cancel</a>
</form>

{% endblock %}
